hostname core
service integrated-vtysh-config
!
ip access-list USERS_IN
 seq 10 deny tcp 10.10.10.0/24 10.20.20.0/24 eq 22
 seq 20 permit ip any any
!
ip access-list DMZ_IN
 seq 10 deny ip 10.40.40.0/24 10.20.20.0/24
 seq 20 permit tcp 10.40.40.0/24 10.30.30.0/24 eq 8443
 seq 30 deny ip 10.40.40.0/24 10.30.30.0/24
 seq 40 permit ip any any
!
interface eth1
 description TO_EDGE
 ip address 10.0.0.2/30
 ip access-group USERS_IN in
!
interface eth2
 description TO_DMZ
 ip address 10.0.0.5/30
 ip access-group DMZ_IN in
!
interface eth3
 description MANAGEMENT_LAN
 ip address 10.20.20.1/24
!
interface eth4
 description INTERNAL_SERVICES
 ip address 10.30.30.1/24
!
ip route 10.10.10.0/24 10.0.0.1
ip route 10.40.40.0/24 10.0.0.6
!
line vty
!
