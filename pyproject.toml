[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "netchange-guard"
version = "0.1.0"
description = "Policy-driven, offline network change validation with Batfish"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NetChange Guard contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Networking",
  "Topic :: Security",
]
dependencies = [
  "pybatfish==2026.9.17.3748",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "ruff==0.14.0",
  "setuptools==83.0.0",
  "types-PyYAML==6.0.12.20260906",
]

[project.scripts]
netchange-guard = "netchange_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netchange_guard"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=netchange_guard --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["reports/"]

[[tool.mypy.overrides]]
module = ["pybatfish.*"]
ignore_missing_imports = true
