services:
  batfish:
    image: batfish/allinone@sha256:54cb0ed94fd9a3c1ca0985f73e5be479e955cee9b9f6a6799b66be3364fd8e5c
    container_name: netchange-guard-batfish
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9996:9996"
      - "127.0.0.1:9997:9997"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:9996/v2/network', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
